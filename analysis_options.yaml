include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    # Generated by drift. Rebuilt by `dart run build_runner build`, and not
    # worth linting or reading.
    - "**/*.g.dart"

linter:
  # A list, not a map. YAML will not take both in one block, and the two lints
  # that were written here as `name: false` are not in flutter_lints anyway.
  rules:
    - prefer_final_locals
    - unnecessary_this
    - avoid_relative_lib_imports
