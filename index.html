<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0F12" />
    <meta
      name="description"
      content="Warranties, receipts and manuals for everything you own. Everything stays on your device."
    />

    <!-- iOS ignores the web app manifest; these are its equivalents. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stash it" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="icon-192.png" type="image/png" />

    <title>Stash it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="icon-512.png" />

    <!--
      The splash lives here, not in React.

      Anything React renders can only appear after the bundle has downloaded,
      parsed and mounted — and until then the page is an empty body, which on a
      dark theme is a black screen. Putting the mark in the document itself
      makes it the very first paint, with no gap in front of it.

      The styles are inline for the same reason: a stylesheet is another
      request to wait on. The palette is duplicated from tokens.css on purpose;
      it's four values and they buy the whole gap.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #0d0f12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        text-align: center;
        opacity: 1;
        transition: opacity 0.42s ease;
      }
      #splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 176px;
        height: 176px;
        animation: splashFloat 4.4s ease-in-out infinite;
      }
      #splash h1 {
        margin: 0;
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: -0.03em;
        color: #eaedf0;
      }
      #splash h1 span {
        color: #f2b33d;
      }
      #splash p {
        margin: -14px 0 0;
        max-width: 26ch;
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.6;
        color: #8b949e;
      }
      @keyframes splashFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-9px);
        }
      }
      @media (prefers-color-scheme: light) {
        #splash {
          background: #f4f2ed;
        }
        #splash h1 {
          color: #22252a;
        }
        #splash h1 span {
          color: #9a6b0f;
        }
        #splash p {
          color: #6b7079;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash">
      <img src="icon-512.png" alt="" />
      <h1>Stash<span>&nbsp;it</span></h1>
      <p>Warranties, receipts and manuals for everything you own.</p>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
