<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F2ED" />
    <meta
      name="description"
      content="Warranties, receipts and manuals for everything you own. Everything stays on your device."
    />

    <!-- iOS ignores the web app manifest; these are its equivalents. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      "default" rather than black-translucent: translucent draws white status
      bar text over whatever is beneath it, which on a light launch screen is
      white on cream. Unreadable for the second that matters most.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stash it" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="icon-192.png" type="image/png" />

    <title>Stash it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="splash-scout.png" />

    <!--
      The splash lives here, not in React.

      Anything React renders can only appear after the bundle has downloaded,
      parsed and mounted — and until then the page is an empty body. Putting
      the mark in the document itself makes it the very first paint, with no
      gap in front of it.

      It is light in both themes, on purpose. The launch screen is the one
      surface the OS also draws (from the manifest's background_color), and the
      two have to match or you get a flash of one colour into another. Matching
      a fixed light background is achievable; matching a per-device theme
      preference is not, because the manifest can only name one colour.

      Styles are inline for the same reason the markup is: a stylesheet is
      another request to wait on.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #f4f2ed;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 24px;
        text-align: center;
        opacity: 1;
        transition: opacity 0.42s ease;
      }
      #splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      /*
        Waiting for a fingerprint. Android draws its verification dialog over
        the bottom two thirds, so the mark moves up into the third it leaves
        alone — the app stays recognisably itself while the platform asks the
        question, and there is no second screen of our own to look at.
      */
      #splash.waiting {
        justify-content: flex-start;
        padding-top: 4vh;
        gap: 12px;
      }
      /*
        Only Scout shrinks. The wordmark and the line under it stay exactly as
        they are in the centred state — the two launches should read as the
        same screen in two positions, not as two different screens, and the
        title changing size is what would give that away. Scout has the room
        to give up; the type doesn't.
      */
      #splash.waiting img {
        width: 96px;
        height: 96px;
      }
      #splash.waiting p {
        margin-top: -4px;
      }
      #splash img {
        width: 190px;
        height: 190px;
        object-fit: contain;
        animation: splashFloat 4.4s ease-in-out infinite;
      }
      #splash h1 {
        margin: 0;
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.035em;
        color: #22252a;
      }
      #splash h1 span {
        color: #9a6b0f;
      }
      #splash p {
        margin: -12px 0 0;
        max-width: 26ch;
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.6;
        color: #6b7079;
      }
      @keyframes splashFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-9px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash">
      <img src="splash-scout.png" alt="" />
      <h1>Stash<span>&nbsp;it</span></h1>
      <p>Warranties, receipts and manuals for everything you own.</p>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
