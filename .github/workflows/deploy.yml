name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # ── Why there is a path filter now ──────────────────────────────────────
    #
    # The Android app lives in `mobile/` in this same repository. Without this
    # list, every Dart commit would install npm, typecheck TypeScript, run the
    # web test suite and redeploy an identical site — several minutes of CI to
    # publish exactly what was already published.
    #
    # It is an ALLOW list rather than a `paths-ignore: [mobile/**]`, because
    # the failure modes are not symmetrical. An ignore list is wrong the moment
    # somebody adds a second non-web folder and nobody remembers to add it; an
    # allow list is wrong only in the direction of not deploying, which is
    # visible immediately and fixed by pushing again.
    #
    # `workflow_dispatch` below is the escape hatch: if a deploy is ever needed
    # for something not on this list, it can be run by hand from the Actions
    # tab without editing the filter.
    paths:
      - 'src/**'
      - 'site/**'
      - 'public/**'
      - 'test/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Allow one deploy at a time; a queued run supersedes an older one rather than
# racing it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # A project site lives at https://<user>.github.io/<repo>/. The marketing
      # site takes that root and the app sits at /<repo>/app/ — see the note in
      # vite.config.ts for why they can't share a path.
      #
      # SITE_PATH is the manifest scope: one level above the app, so the
      # website is inside it and its install button can work.
      # VAPID_PUBLIC_KEY and PUSH_ENDPOINT are repository *variables*, not
      # secrets. Both are public by definition — the key is handed to Google
      # and Apple by the browser, and the endpoint is a URL the app fetches —
      # so both end up in the bundle either way. Storing them as secrets would
      # buy nothing and cost the ability to read them back.
      #
      # `.env.local` is gitignored and only exists on one laptop, so without
      # these two lines every deployed build ships an empty key and the
      # Reminders switch correctly reports itself unconfigured. That is a
      # supported state for a fork, and was not the intended state here.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/app/
          SITE_PATH: /${{ github.event.repository.name }}/
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          PUSH_ENDPOINT: ${{ vars.PUSH_ENDPOINT }}

      # An empty key is a legitimate build. A key that was configured and then
      # silently dropped is not, and it fails quietly: the deploy is green, the
      # app looks fine, and the switch simply refuses. That is the exact shape
      # of the process.env/loadEnv bug this project already shipped once, so
      # the assertion is against the built output rather than the environment.
      - name: Check the reminders build
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          PUSH_ENDPOINT: ${{ vars.PUSH_ENDPOINT }}
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ]; then
            echo "::notice::No VAPID_PUBLIC_KEY variable — reminders will be off in this build."
            exit 0
          fi
          if ! grep -rqF "$VAPID_PUBLIC_KEY" dist/assets; then
            echo "::error::VAPID_PUBLIC_KEY is set but did not reach the bundle."
            exit 1
          fi
          echo "Reminders key present in the bundle."
          if [ -z "$PUSH_ENDPOINT" ]; then
            echo "::notice::No PUSH_ENDPOINT — schedules stay on the device."
          elif ! grep -rqF "$PUSH_ENDPOINT" dist/assets; then
            echo "::error::PUSH_ENDPOINT is set but did not reach the bundle."
            exit 1
          fi

      # The site at the root, the app underneath it. site/sw.js lands at the
      # app's old address on purpose: it's a worker that unregisters itself,
      # so anyone still carrying the old one stops being served a cached app
      # shell where the website should be.
      - name: Assemble the site and the app
        run: |
          mkdir -p out/app
          cp -r dist/* out/app/
          cp -r site/* out/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
